<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0d6efd" />

    <!-- 🔍 SEO Meta Tags -->
    <meta
      name="description"
      content="Pakricorn – Empowering Digital Growth through Technology, Creativity, and Innovation."
    />
    <meta
      name="keywords"
      content="Pakricorn, Web Development, React, Technology, Software, IT Services, Digital Solutions"
    />
    <meta name="author" content="Pakricorn Technologies" />

    <!-- 🌐 Open Graph (for social media preview) -->
    <meta property="og:title" content="Pakricorn | Digital Solutions" />
    <meta
      property="og:description"
      content="We build modern digital experiences with React, Ionic, and cutting-edge web technologies."
    />
    <meta property="og:image" content="%PUBLIC_URL%/pakricorn1.png" />
    <meta property="og:url" content="https://pakricorn.com" />
    <meta property="og:type" content="website" />

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pakricorn | Digital Solutions" />
    <meta
      name="twitter:description"
      content="Empowering Digital Growth through Technology and Innovation."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/pakricorn1.png" />

    <!-- 📱 Icons -->
    <link rel="icon" href="%PUBLIC_URL%/pakricorn1.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/pakricorn1.png" />

    <!-- 📋 Manifest (for PWA support) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- 🖋️ Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- 💅 Custom CSS (optional global styles) -->
    <style>
      body {
        margin: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #ffffff;
        color: #212529;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      noscript {
        text-align: center;
        font-size: 1rem;
        color: #555;
        padding: 2rem;
      }
    </style>

    <!-- 📛 Title -->
    <title>Pakricorn | Digital Solutions</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
